stages:
  - test
  - build

# Set environment variables
variables:
  # Tell Cargo to store its registry/cache inside the GitLab directory
  # so that GitLab can cache it between pipeline runs to speed up builds!
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

# Cache dependencies to make future runs blazingly fast
cache:
  key: rust-cache
  paths:
    - .cargo/
    - target/

# ==========================================
# 1. The Test Stage
# ==========================================
unit_tests:
  image: rust:latest
  stage: test
  script:
    - echo "Running the TDD suite..."
    - cargo test

# ==========================================
# 2. The Build Stage
# ==========================================

# Linux (Built natively on the Linux runner)
build_linux:
  image: rust:latest
  stage: build
  script:
    - echo "Building highly optimized Linux binary..."
    - cargo build --release
  artifacts:
    name: "ocgrep-linux"
    paths:
      - target/release/ocgrep
    expire_in: 1 week

# Windows (Cross-compiled from the Linux runner)
build_windows:
  image: rust:latest
  stage: build
  before_script:
    # Install the Windows compilation tools
    - apt-get update && apt-get install -y mingw-w64
    # Tell Rust to download the Windows standard library
    - rustup target add x86_64-pc-windows-gnu
  script:
    - echo "Cross-compiling for Windows..."
    - cargo build --release --target x86_64-pc-windows-gnu
  artifacts:
    name: "ocgrep-windows"
    paths:
      - target/x86_64-pc-windows-gnu/release/ocgrep.exe
    expire_in: 1 week

# macOS (Built natively on a GitLab Apple Silicon runner)
build_macos_arm64:
  stage: build
  # Route this job to GitLab's shared macOS runners
  tags:
    - saas-macos-medium-m1
  before_script:
    # macOS runners usually don't have Rust pre-installed, so we grab it quickly
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
  script:
    - echo "Building for Apple Silicon (M1/M2/M3)..."
    - cargo build --release
  artifacts:
    name: "ocgrep-macos-arm64"
    paths:
      - target/release/ocgrep
    expire_in: 1 week
